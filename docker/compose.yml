version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ../.env 
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../mineral-shop-backend
      dockerfile: ../docker/Dockerfile
    env_file:
      - ../.env
    depends_on:
      - db
