version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ../.env 
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../mineral-shop-backend
      dockerfile: ../docker/Dockerfile
    command: gunicorn shop_backend.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - ../.env 
    depends_on:
      - db
    ports:
      - "8000:8000"
