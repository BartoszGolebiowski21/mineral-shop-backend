version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ../.env 
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ../mineral-shop-backend
      dockerfile: ../docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../mineral-shop-backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ../.env 
    depends_on:
      - db
    stdin_open: true
    tty: true
