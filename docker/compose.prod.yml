services:
  backend:
    command: gunicorn shop_backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./media:/app/media
    networks:
      - default
      - proxy-net

  nginx-backend:
    image: nginx:alpine
    container_name: backend-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/media
    depends_on:
      - backend
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
