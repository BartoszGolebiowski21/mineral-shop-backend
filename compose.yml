services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-net

  backend:
    build: .
    user: "root" # Startuje jako root tylko po to, by wykonać chown na zamontowanym wolumenie VPS-a
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    command: >
      bash -c "chown -R appuser:appuser /app/media && 
      sleep 10 && 
      python manage.py migrate && 
      exec su -s /bin/bash appuser -c 'gunicorn shop_backend.wsgi:application --bind 0.0.0.0:8000 --timeout 120'"
    volumes:
      - ./media:/app/media
    networks:
      - proxy-net
    expose:
      - "8000"

networks:
  proxy-net:
    external: true